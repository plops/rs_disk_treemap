name: Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ] # Triggers release workflow on version tags (e.g., v1.0.0)
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Required to allow the workflow to create and upload assets to GitHub Releases
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.project.name }} (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        project:
          # Configuration for the MVP project
          - dir: 00_mvp
            name: treemap_mvp
            bin: treemap_mvp
          # Configuration for the advanced project
          - dir: 01_more
            name: treemap-disk-analyzer
            bin: treemap-disk-analyzer
          # Configuration for the transpiled project (gen.lisp -> main.rs)
          - dir: 03_mvp_lisp
            name: treemap-lisp
            bin: treemap_lisp
        include:
          - os: ubuntu-latest
            os_name: linux
            ext: ""
          - os: windows-latest
            os_name: windows
            ext: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # System dependencies required by macroquad/miniquad on headless Linux
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ matrix.project.dir }} -> target"

      - name: Build release binary
        working-directory: ${{ matrix.project.dir }}
        run: cargo build --release

      - name: Rename binary for distribution
        shell: bash
        run: |
          cd ${{ matrix.project.dir }}/target/release/
          mv ${{ matrix.project.bin }}${{ matrix.ext }} ${{ matrix.project.bin }}-${{ matrix.os_name }}${{ matrix.ext }}

      - name: Upload Artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.name }}-${{ matrix.os_name }}
          path: ${{ matrix.project.dir }}/target/release/${{ matrix.project.bin }}-${{ matrix.os_name }}${{ matrix.ext }}
          if-no-files-found: warn

      - name: Publish to GitHub Release
        # Only run this step if a tag starting with 'v' was pushed
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # This action will automatically create a release if it doesn't exist for the tag
          files: ${{ matrix.project.dir }}/target/release/${{ matrix.project.bin }}-${{ matrix.os_name }}${{ matrix.ext }}

  smoke:
    name: Smoke test (linux + xvfb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "01_more -> target\n03_mvp_lisp -> target"

      - name: fmt, clippy and tests
        working-directory: 01_more
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Headless smoke
        working-directory: 01_more
        run: ./target/debug/treemap-disk-analyzer --headless . | head -n 5

      - name: GUI smoke under xvfb
        working-directory: 01_more
        # timeout kills the event loop after 20s: exit 124 means the GUI
        # was still running (healthy); anything else (e.g. 101 on panic)
        # fails the job.
        run: |
          test "$(timeout 20 xvfb-run -a ./target/debug/treemap-disk-analyzer . >gui.log 2>&1; echo $?)" = "124"

      - name: fmt, clippy and tests (03_mvp_lisp)
        working-directory: 03_mvp_lisp
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: GUI smoke under xvfb (03_mvp_lisp)
        working-directory: 03_mvp_lisp
        # Same liveness convention as above: timeout exit 124 is healthy.
        # The transpiled binary additionally logs scan/layout lines
        # (lprint) and scan errors (report_skip) to stderr.
        run: |
          test "$(timeout 20 xvfb-run -a ./target/debug/treemap_lisp . >gui03.log 2>&1; echo $?)" = "124"
          grep -q "^target " gui03.log